name: untitled
description: "Bitmoji-Style Avatar Builder Application built with Flutter & GetX."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  image_picker: ^1.1.2
  fluttermoji: ^1.0.2
  get: ^4.7.3
  get_storage: ^2.1.1
  flutter_svg: ^2.3.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  flutter_3d_controller: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/avatar.glb
    - assets/models/3d_parts/
    - assets/models/modular_parts/men/
    - assets/models/modular_parts/women/
    - assets/models/characters/men/
    - assets/models/characters/women/


